name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Compile Python files
        run: python3 -m py_compile package/contents/code/agent-usage-json package/contents/code/claude-statusline-collector

      - name: Validate package metadata
        run: python3 -m json.tool package/metadata.json >/dev/null

      - name: Set the package version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            "" | .* | *[!0-9.]*)
              echo "Error: tag $GITHUB_REF_NAME is not a version like v1.2.3." >&2
              exit 1
              ;;
          esac
          jq --arg version "$version" '.KPlugin.Version = $version' package/metadata.json > package/metadata.json.tmp
          mv package/metadata.json.tmp package/metadata.json
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Build the plasmoid package
        run: |
          mkdir dist
          (cd package && zip -r "../dist/io.github.kde-agents-usage-${version}.plasmoid" .)

      - name: Verify the plasmoid package
        run: |
          test "$(unzip -l "dist/io.github.kde-agents-usage-${version}.plasmoid" | grep -cE '[[:space:]]metadata\.json$')" -eq 1

      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/io.github.kde-agents-usage-${version}.plasmoid" \
            --title "Agents Usage ${version}" \
            --generate-notes