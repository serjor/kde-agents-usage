name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach the plasmoid to, like v1.2.3
        required: true

permissions:
  contents: write

# A release created on GitHub triggers both the tag push and the release event.
# Both runs build the same file, so the second one waits and replaces the asset.
concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Get the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Compile Python files
        run: python3 -m py_compile package/contents/code/agent-usage-json package/contents/code/claude-statusline-collector

      - name: Validate package metadata
        run: python3 -m json.tool package/metadata.json >/dev/null

      - name: Set the package version from the tag
        run: |
          version="${TAG#v}"
          case "$version" in
            "" | .* | *[!0-9.]*)
              echo "Error: tag $TAG is not a version like v1.2.3." >&2
              exit 1
              ;;
          esac
          jq --arg version "$version" '.KPlugin.Version = $version' package/metadata.json > package/metadata.json.tmp
          mv package/metadata.json.tmp package/metadata.json
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Build the plasmoid package
        run: |
          mkdir dist
          # Tests and py_compile leave bytecode in package/; keep it out of the plasmoid.
          (cd package && zip -r "../dist/io.github.kde-agents-usage-${version}.plasmoid" . -x '*__pycache__/*' '*.pyc')

      - name: Verify the plasmoid package
        run: |
          file="dist/io.github.kde-agents-usage-${version}.plasmoid"
          test "$(unzip -l "$file" | grep -cE '[[:space:]]metadata\.json$')" -eq 1
          if unzip -l "$file" | grep -qE '__pycache__|\.pyc$'; then
            echo "Error: the plasmoid contains Python bytecode." >&2
            exit 1
          fi

      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          file="dist/io.github.kde-agents-usage-${version}.plasmoid"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$file" --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Agents Usage ${version}" \
              --generate-notes
          fi